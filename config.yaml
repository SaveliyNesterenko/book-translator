# Book Translator — fixed TranslateGemma 12B configuration

lmstudio:
  base_url: "http://127.0.0.1:9879/v1"
  model: "translategemma-12b-it"
  source_lang_code: "en"
  target_lang_code: "ru"
  api_key: "lm-studio"
  connect_timeout_seconds: 10
  read_timeout_seconds: 600

chunking:
  # TranslateGemma is designed for compact translation requests.
  target_tokens: 1500
  hard_max_tokens: 1900
  chars_per_token: 3.7

translation:
  max_output_tokens: 4096
  max_retries: 5
  retry_backoff_seconds: [5, 15, 30, 60, 120]

validation:
  # Only gross technical failures are rejected; this is not a quality score.
  min_length_ratio: 0.45
  max_length_ratio: 2.2

preprocessing:
  strip_gutenberg_wrapper: true

paths:
  projects_dir: "projects"
  output_dir: "output"
